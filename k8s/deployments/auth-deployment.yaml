apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: web-app-sa
      containers:
        - name: auth-service
          image: pocwebapp/auth-poc-web-app-othman-martin:latest
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: "postgres-service" 
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "webapp"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DB_NAME
              value: "pocwebapp"
            - name: PORT
              value: "8081"