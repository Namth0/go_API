apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  namespace: web-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - web-app.com  # <-- remplace par ton vrai domaine
      secretName: webapp-tls-secret 
  rules:
    - host: web-app.com  # <-- remplace ici aussi
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: go-api-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextjs-service
                port:
                  number: 80