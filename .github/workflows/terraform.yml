name: 'Terraform'
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destruction de l'infrastructure"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: './terraform'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Attach Policy
        id: attach
        run: |
            # Get AWS account ID
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            
            # Check if policy exists
            if ! aws iam get-policy --policy-arn "arn:aws:iam::637423251830:policy/EBS-CSI-Policy" 2>/dev/null; then
                echo "Creating new policy..."
                aws iam create-policy --policy-name EBS-CSI-Policy --policy-document file://iam-policy.json
            else
                echo "Policy already exists"
            fi
            
            # Check if policy is already attached
            if ! aws iam list-attached-user-policies --user-name eks-web-app | grep -q "EBS-CSI-Policy"; then
                echo "Attaching policy to user..."
                aws iam attach-user-policy --user-name eks-web-app --policy-arn "arn:aws:iam::637423251830:policy/EBS-CSI-Policy"
            else
                echo "Policy already attached to user"
            fi
     
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init
      
      - name: Terraform Validate
        id: validate
        run: terraform validate
        
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true
        
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.destroy == false
        run: terraform apply -auto-approve
        
      - name: Déploiement de kubernetes sur AWS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.destroy == false
        run: |
          aws eks update-kubeconfig --name web-app-master-1-cluster-eks --region eu-west-3

          # Installation de kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Vérification de la connexion au cluster
          kubectl get nodes
          
          # Application des ConfigMaps
          kubectl apply -f k8s/configmaps/
          
          # Installation de cert-manager
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
          kubectl wait --for=condition=Ready pods -l app=cert-manager -n cert-manager --timeout=120s
          kubectl apply -f k8s/cert-manager/
          
          # Installation de l'Ingress Controller (NGINX)
          kubectl apply -f k8s/ingress-nginx/
          kubectl wait --for=condition=Ready pods -l app.kubernetes.io/component=controller -n ingress-nginx --timeout=120s
          
          # Installation d'Istio
          curl -L https://istio.io/downloadIstio | sh -
          cd istio-*
          export PATH=$PWD/bin:$PATH
          istioctl install -y
          kubectl label namespace web-app istio-injection=enabled
          cd ..
          kubectl apply -f k8s/istio/
          
          # Déploiement des autres ressources Kubernetes
          kubectl apply -f k8s/deployments/
          kubectl apply -f k8s/services/
          kubectl apply -f k8s/

          # Vérification de l'état du déploiement
          kubectl get pods --all-namespaces

  destroy:
    name: "Destruction de l'infrastructure"
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && inputs.destroy == true
    defaults:
      run:
        shell: bash
        working-directory: './terraform'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          
      - name: Terraform Init
        id: init
        run: terraform init
        
      - name: Nettoyage des ressources Kubernetes avant destruction
        run: |
          aws eks update-kubeconfig --name web-app-master-1-cluster-eks --region eu-west-3
          
          # Installation de kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Suppression de l'ensemble des ressources pour éviter des problèmes de finalizers
          echo "Suppression des namespaces personnalisés..."
          kubectl delete ns istio-system --ignore-not-found=true
          kubectl delete ns cert-manager --ignore-not-found=true
          kubectl delete ns ingress-nginx --ignore-not-found=true
          
          echo "Suppression des ressources Kubernetes spécifiques..."
          kubectl delete -f k8s/ingress/ --ignore-not-found=true
          kubectl delete -f k8s/services/ --ignore-not-found=true
          kubectl delete -f k8s/deployments/ --ignore-not-found=true
          kubectl delete -f k8s/ --ignore-not-found=true
          
        continue-on-error: true
        
      - name: Terraform Destroy
        run: terraform destroy -auto-approve