services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: OthmanEtMartin
      POSTGRES_DB: pocwebapp
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ../backend
    container_name: backend_container
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      GIN_MODE: debug
      ALLOWED_ORIGINS: "http://localhost:3000"
    networks:
      - app-network

  frontend:
      build: 
        context: ./
        dockerfile: Dockerfile.test
      container_name: frontend_container
      restart: always
      ports:
        - "3000:3000"
      depends_on:
        - backend
      environment:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080/api/v1"        # Pour le navigateur
        NEXT_PUBLIC_API_BASE_URL_INTERNAL: "http://backend:8080/api/v1" # Pour SSR
        NODE_ENV: development
        NEXT_PUBLIC_DEBUG: "true"
      volumes:
        - .:/app
        - /app/node_modules
      networks:
        - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
